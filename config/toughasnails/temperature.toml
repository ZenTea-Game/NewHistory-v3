[general]
# Сколько тиков действует согрев/охлаждение от еды/напитков (20 тиков = 1 сек).
# БЫЛО 1200 (1 мин) → 2400 (2 мин): еда дольше держит комфорт.
consumable_effect_duration = 2400

# Задержка смены температуры от среды. ВЫШЕ = медленнее греешься/мёрзнешь.
# БЫЛО 500 → 800: не «сразу греется», а плавно.
temperature_change_delay = 800

# Задержка от состояния игрока (мокрый и т.п.). БЫЛО 125 → 200.
player_temperature_change_delay = 200

# Порядок модификаторов — НЕ ТРОГАТЬ.
temperature_modifier_order = [ "player_modifiers", "item_modifier", "armor_modifier", "internal_modifier" ]

# Сколько тиков в ЭКСТРИМУ (жара/мороз) до начала урона.
# БЫЛО 500 (25 сек) → 1200 (60 сек). ЭТО ГЛАВНОЕ ДЛЯ АДА:
# целая минута в жаре без урона — успеваешь убежать/остыть без брони.
extremity_damage_delay = 1200

# Задержка после согрева/охлаждения едой. НЕ ТРОГАТЬ.
internal_temperature_change_delay = 20

# Задержка смены температуры в броне. ВЫШЕ = броня защищает мягче. БЫЛО 50 → 100.
armor_temperature_change_delay = 100

# Задержка с предметом в руке (факел/лёд). ВЫШЕ = факел греет дольше. БЫЛО 375 → 500.
handheld_temperature_change_delay = 500

# Отсрочка после респауна (иммунитет к климату). БЫЛО false → true.
climate_clemency_respawning = true

# Длительность отсрочки. БЫЛО 6000 (5 мин) → 9000 (7.5 мин).
climate_clemency_duration = 9000

# Задержка «отката» после экстрима. БЫЛО 250 → 400.
extremity_rebound_temperature_change_delay = 400

[altitude]
# Высота, с которой холодает. БЫЛО 160 → 200.
temperature_drop_altitude = 200
# Глубина, с которой жарче. БЫЛО -32 → -48.
temperature_rise_altitude = -48
# Высота внешних модификаторов. НЕ ТРОГАТЬ.
environmental_modifier_altitude = 50

[immersion]
# Сколько тиков остаёшься МОКРЫМ после воды/дождя. БЫЛО 40 → 20 (влажность легче).
wet_ticks = 20
# Охлаждение в порошковом снеге. БЫЛО -2 → -1 (льдины легче).
powdered_snow_temperature_change = -1
# Охлаждение в снегопад. Оставил -1: интересно, но не жесть.
snow_temperature_change = -1
# Охлаждение, когда мокрый. БЫЛО -1 → 0 (мокрый больше не морозит).
wet_temperature_change = 0
# Нагрев, когда горишь. БЫЛО 2 → 1 (не греет так резко).
on_fire_temperature_change = 1

[blocks]
# Радиус действия печек/льда. БЫЛО 8 → 6 (меньше резких скачков у блоков).
near_heat_cool_proximity = 6

[toggles]
# Включить температуру.
enable_temperature = true