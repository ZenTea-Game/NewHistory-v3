[general]
# Порог, при котором жажда начинает падать. ВЫШЕ = медленнее сохнет.
# БЫЛО 8.0, я давал 12.0 (перебор). Ставлю СЕРЕДИНУ: 10.0.
exhaustion_threshold = 10.0

[drink_options]
# Гидратация от питья рукой.
hand_drinking_hydration = 0.1
# Жажды восстанавливает питьё рукой.
hand_drinking_thirst = 1

[toggles]
# Запрет спринта при жажде. false = спринт всегда можно (не слишком жёстко).
thirst_prevent_sprint = false
# Запрет регена здоровья при жажде. ВЕРНУЛ true — это и есть «интерес»:
# держишь жажду в норме → здоровье регенит; пересох → регена нет.
thirst_prevent_health_regen = true
# Включить жажду.
enable_thirst = true
# Удалять воду при наполнении фляги.
remove_source_blocks = false
# Пить рукой (ПКМ по воде). Удобно, оставил. БЫЛО false → true.
enable_hand_drinking = true